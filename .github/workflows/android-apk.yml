name: Android APK
on:
  push:
    branches: [feature/rpg-narrativo-mundo-vivo]
    paths:
      - 'rpg-narrativo/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Preparar ferramentas Android
        env:
          VEYRATH_DEBUG_KEYSTORE_BASE64: ${{ secrets.VEYRATH_DEBUG_KEYSTORE_BASE64 }}
        run: |
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          mkdir -p ~/.android
          if [ -n "$VEYRATH_DEBUG_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$VEYRATH_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
          else
            echo '::warning::Chave de desenvolvimento efêmera. Esta build pode exigir instalação separada.'
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Instalar Godot e templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres
      - name: Importar e verificar projeto
        run: godot --headless --path rpg-narrativo --editor --import --quit
      - name: Testar campanha e salvamento
        run: godot --headless --path rpg-narrativo --script res://tests.gd
      - name: Testar campanha Veyrath
        run: godot --headless --path rpg-narrativo --script res://veyrath/tests.gd
      - name: Testar defesa e persistencia
        run: godot --headless --path rpg-narrativo --script res://veyrath/defense_tests.gd
      - name: Testar ficha, acoes e mundo solo
        run: godot --headless --path rpg-narrativo --script res://veyrath/systems_tests.gd
      - name: Testar assinatura, atualizacoes e rollback
        run: godot --headless --path rpg-narrativo --script res://veyrath/updates/update_tests.gd
      - name: Testar historia remota e isolamento do save
        run: XDG_DATA_HOME="$RUNNER_TEMP/veyrath-update-test" godot --headless --path rpg-narrativo --script res://veyrath/updates/story_tests.gd
      - name: Testar expansão procedural e viagens offline
        run: XDG_DATA_HOME="$RUNNER_TEMP/veyrath-expansion-test" godot --headless --path rpg-narrativo --script res://veyrath/expansion/tests.gd
      - name: Testar diretor de tramas e legados offline
        run: XDG_DATA_HOME="$RUNNER_TEMP/veyrath-chronicles-test" godot --headless --path rpg-narrativo --script res://veyrath/chronicles/tests.gd
      - name: Testar navegacao da interface
        run: godot --headless --path rpg-narrativo --script res://veyrath/ui_tests.gd
      - name: Verificar abertura da cena principal
        run: |
          godot --headless --path rpg-narrativo --quit-after 3 2>&1 | tee /tmp/veyrath-start.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/veyrath-start.log; then exit 1; fi
      - name: Exportar APK de desenvolvimento
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          godot --headless --path rpg-narrativo --export-debug Android "$RUNNER_TEMP/apk/veyrath-debug.apk"
          test -s "$RUNNER_TEMP/apk/veyrath-debug.apk"
          expected="$(keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          signer="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/apk/veyrath-debug.apk")"
          actual="$(printf '%s\n' "$signer" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$expected" && test "$expected" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: veyrath-android-debug
          path: ${{ runner.temp }}/apk/veyrath-debug.apk
          if-no-files-found: error
      - name: Capturar telas no Godot com renderização
        continue-on-error: true
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
          mkdir -p "$RUNNER_TEMP/vey-screens"
          export VEY_SCREENSHOTS="$RUNNER_TEMP/vey-screens"
          export XDG_DATA_HOME="$RUNNER_TEMP/vey-screenshot-save"
          timeout 45 xvfb-run -a -s '-screen 0 900x1440x24' godot --path rpg-narrativo --resolution 540x960 --script res://veyrath/capture_screens.gd
          test "$(find "$VEY_SCREENSHOTS" -name '*.png' | wc -l)" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: veyrath-capturas-godot
          path: ${{ runner.temp }}/vey-screens/*.png
          if-no-files-found: ignore
